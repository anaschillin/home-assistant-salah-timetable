name: Reconcile feature releases

on:
  workflow_run:
    workflows: [Validate, CodeQL, Feature release lifecycle]
    types: [requested, completed]
  workflow_dispatch:

permissions:
  contents: read

# Reconcile current API state, never a queued event's potentially stale PR snapshot.
concurrency:
  group: feature-releases
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Maintain one tested prerelease per ready pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/feature_releases.mjs
