name: Import mosque background photos

on:
  push:
    branches:
      - feature/mosque-backgrounds
    paths:
      - .github/workflows/import-mosque-backgrounds.yml
      - scripts/import_mosque_backgrounds.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mosque-background-asset-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/feature/mosque-backgrounds'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/mosque-backgrounds
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install offline image-optimisation tools
        run: python -m pip install Pillow==12.3.0 ruff==0.17.2
      - name: Download and encode the eight licensed mosque photographs
        run: python scripts/import_mosque_backgrounds.py
      - name: Run Ruff formatting on changed Python files
        run: python -m ruff format scripts/import_mosque_backgrounds.py scripts/check_asset_provenance.py scripts/build_release.py tests/test_frontend.py
      - name: Verify asset inventory and release packaging
        run: |
          python scripts/check_asset_provenance.py
          python scripts/build_release.py --check
      - name: Commit verified binary assets and metadata to PR branch
        run: |
          git add scripts/import_mosque_backgrounds.py scripts/check_asset_provenance.py scripts/build_release.py tests/test_frontend.py docs/asset-provenance.json docs/mosque-background-credits.md custom_components/salah_timetable/frontend/mosque-backgrounds.js custom_components/salah_timetable/frontend/backgrounds/
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "assets: bundle eight optimised and credited mosque photographs"
          git push origin HEAD:feature/mosque-backgrounds
