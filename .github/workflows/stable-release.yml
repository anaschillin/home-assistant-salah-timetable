name: Publish stable HACS release

# Validate and CodeQL are read-only. This privileged follow-up trusts only
# the currently checked-out main commit and independently queries both results.
on:
  workflow_run:
    workflows: [Validate, CodeQL]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-hacs-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Require a new version and successful Validate / CodeQL on exact main
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/stable_releases.mjs

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.candidate.outputs.publish == 'true'
        with:
          python-version: '3.14'
      - name: Recheck versions, asset licences and deterministic release files
        if: steps.candidate.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sync_versions.py --check
          python scripts/check_asset_provenance.py --require-cleared
          python -m scripts.prepare_release --tag "$RELEASE_TAG" --output-dir dist
          (cd dist && sha256sum --check *.zip.sha256)

      - name: Tag tested main commit and publish one immutable stable release
        if: steps.candidate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # A newer main commit or missing/failed checks must not publish stale code.
          node scripts/stable_releases.mjs --assert

          # A pre-existing tag must point to the exact validated SHA (checked above).
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_SHA" >/dev/null
          fi
          node scripts/stable_releases.mjs --assert

          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Salah Timetable $RELEASE_TAG" \
            --notes-file dist/release-notes.md \
            dist/*.zip dist/*.zip.sha256
