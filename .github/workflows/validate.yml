name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.23'
      - run: uv sync --frozen --group dev
      - run: python scripts/check_asset_provenance.py
      - name: Run Ruff formatter on modified Python files
        run: uv run --frozen ruff format scripts/check_coverage.py tests/test_pdf_worker_unit.py
      - name: Verify Ruff formatting did not modify checked-in files
        run: git diff --exit-code -- scripts/check_coverage.py tests/test_pdf_worker_unit.py
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - name: Run tests with branch coverage measurement
        run: uv run --frozen pytest --cov-branch --cov-fail-under=0 --cov-report=json:coverage-branch.json
      - name: Enforce existing line coverage threshold and report branch coverage
        run: uv run --frozen python scripts/check_coverage.py coverage-branch.json
      - run: uv run --frozen python scripts/build_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: salah-timetable-${{ github.sha }}
          path: dist/*.zip*
          if-no-files-found: error
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python3 scripts/sync_frontend_version.py
      - run: npm test
      - name: Run browser smoke tests
        run: npm run test:browser
        env:
          REQUIRE_BROWSER_TESTS: "1"
          CHROME_BIN: /usr/bin/google-chrome
          DBUS_SESSION_BUS_ADDRESS: /dev/null

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          comment: false

  homeassistant-integration:
    name: Home Assistant live acceptance
    uses: ./.github/workflows/live-smoke.yml
    permissions:
      contents: read

  homeassistant-unit-compatibility:
    name: Home Assistant unit compatibility
    uses: ./.github/workflows/unit-compatibility.yml
    permissions:
      contents: read
