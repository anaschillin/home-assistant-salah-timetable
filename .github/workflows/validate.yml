name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect Markdown-only pull request
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python3 scripts/ci_changed_files.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi

  docs:
    name: Documentation integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/sync_versions.py --check

  tests:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'
      - name: Check generated dependency locks
        run: |
          uv lock --check
          uv lock --check --project compatibility/minimum
          uv lock --check --project compatibility/supported-current
      - run: uv sync --frozen --group dev
      - run: python scripts/check_asset_provenance.py
      - name: Run Ruff formatter on modified Python files
        run: uv run --frozen ruff format scripts/check_coverage.py tests/parsers/test_pdf_worker_unit.py
      - name: Verify Ruff formatting did not modify checked-in files
        run: git diff --exit-code -- scripts/check_coverage.py tests/parsers/test_pdf_worker_unit.py
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - name: Run tests with branch coverage measurement
        run: uv run --frozen pytest --cov-branch --cov-fail-under=0 --cov-report=json:coverage-branch.json
      - name: Enforce aggregate, per-module and config-flow coverage gates and generate measured badge data
        run: uv run --frozen python scripts/check_coverage.py coverage-branch.json --badge-output coverage-badge.json
      - name: Upload measured main-branch coverage for README
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-badge
          path: coverage-badge.json
          if-no-files-found: error
          retention-days: 1
      - run: uv run --frozen python scripts/build_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: salah-timetable-${{ github.sha }}
          path: dist/*.zip*
          if-no-files-found: error
          retention-days: 14


  coverage-badge:
    name: Publish measured coverage badge
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: coverage-badge-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badge
      - name: Publish coverage JSON without changing main or triggering CI
        shell: bash
        run: |
          set -euo pipefail
          # Ignore an older run after a newer main commit has landed.
          if [[ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists; skipping stale coverage results"
            exit 0
          fi

          badge_dir="$RUNNER_TEMP/salah-coverage-badges"
          if git ls-remote --exit-code --heads origin badges >/dev/null; then
            git fetch --quiet origin badges
            git worktree add --detach "$badge_dir" FETCH_HEAD
          else
            git worktree add --detach "$badge_dir" HEAD
            git -C "$badge_dir" switch --orphan badges
          fi

          cp coverage-badge.json "$badge_dir/coverage.json"
          git -C "$badge_dir" config user.name "github-actions[bot]"
          git -C "$badge_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$badge_dir" add coverage.json
          if ! git -C "$badge_dir" diff --cached --quiet; then
            git -C "$badge_dir" commit -m "Update measured coverage badge [skip ci]"
            git -C "$badge_dir" push origin HEAD:refs/heads/badges
          else
            echo "Coverage value unchanged; no badge update needed"
          fi

  frontend:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm test
      - name: Run browser smoke tests and capture candidate visual snapshots
        run: npm run test:browser
        env:
          REQUIRE_BROWSER_TESTS: "1"
          CHROME_BIN: /usr/bin/google-chrome
          DBUS_SESSION_BUS_ADDRESS: /dev/null
          BROWSER_SCREENSHOT_DIR: ${{ runner.temp }}/salah-visual-current
      - name: Check out exact pull request base for visual comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: visual-baseline
          persist-credentials: false
      - name: Record visual baseline commit
        if: github.event_name == 'pull_request'
        run: git -C visual-baseline rev-parse HEAD
      - name: Capture baseline screenshots in the same runner
        if: github.event_name == 'pull_request'
        working-directory: visual-baseline
        run: npm run test:browser
        env:
          REQUIRE_BROWSER_TESTS: "1"
          CHROME_BIN: /usr/bin/google-chrome
          DBUS_SESSION_BUS_ADDRESS: /dev/null
          BROWSER_SCREENSHOT_DIR: ${{ runner.temp }}/salah-visual-baseline
      - name: Compare rendered card pixels with pull request base
        if: github.event_name == 'pull_request'
        env:
          VISUAL_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change-approved') }}
        run: |
          approval=""
          if [[ "$VISUAL_CHANGE_APPROVED" == "true" ]]; then
            echo "Explicit visual redesign approval present on pull request"
            approval="--approved-visual-change"
          fi
          node scripts/compare_screenshots.mjs "${{ runner.temp }}/salah-visual-baseline" "${{ runner.temp }}/salah-visual-current" ${approval}
      - name: Upload screenshot evidence for failures and approved redesigns
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (failure() || contains(github.event.pull_request.labels.*.name, 'visual-change-approved')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-visual-diff-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/salah-visual-current/
            ${{ runner.temp }}/salah-visual-baseline/
          if-no-files-found: warn
          retention-days: 7

  hassfest:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

  hacs:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          comment: false

  homeassistant-integration:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Home Assistant live acceptance
    uses: ./.github/workflows/live-smoke.yml
    permissions:
      contents: read

  homeassistant-unit-compatibility:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Home Assistant unit compatibility
    uses: ./.github/workflows/unit-compatibility.yml
    permissions:
      contents: read
