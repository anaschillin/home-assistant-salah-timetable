name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.23'
      - run: uv sync --frozen --group dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest
      - run: uv run --frozen python scripts/build_release.py --check
      - run: uv run --frozen python scripts/build_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: salah-timetable-${{ github.sha }}
          path: dist/*.zip*
          if-no-files-found: error
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm test
      - name: Diagnose Chrome headless startup
        run: |
          mkdir -p /tmp/chrome-debug-test

          timeout 20s google-chrome \
            --headless \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --disable-background-networking \
            --no-first-run \
            --user-data-dir=/tmp/chrome-debug-test \
            --remote-debugging-port=9222 \
            about:blank \
            > /tmp/chrome.log 2>&1 &

          CHROME_PID=$!

          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:9222/json/version; then
              echo "Chrome debugger is ready"
              kill "$CHROME_PID" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done

          cat /tmp/chrome.log
          kill "$CHROME_PID" 2>/dev/null || true
          exit 1

      - name: Run browser smoke tests
        run: npm run test:browser
        env:
          REQUIRE_BROWSER_TESTS: "1"
          CHROME_BIN: /usr/bin/google-chrome
          DBUS_SESSION_BUS_ADDRESS: /dev/null

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          comment: false

  homeassistant-integration:
    name: Home Assistant integration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Home Assistant configuration
        run: |
          mkdir -p test_configuration/custom_components

          cp -a custom_components/salah_timetable \
            test_configuration/custom_components/

          cat > test_configuration/configuration.yaml <<'YAML'
          default_config:
          logger:
            default: warning
            logs:
              custom_components.salah_timetable: debug
          YAML

      - name: Start Home Assistant
        id: homeassistant
        uses: ludeeus/setup-homeassistant@99fb43bcb03063c22ee53a9fac782800910cc29b # 21.11.0
        with:
          tag: stable
          config-dir: test_configuration

      - name: Verify Home Assistant is running
        env:
          HA_URL: ${{ steps.homeassistant.outputs.url }}
          HA_TOKEN: ${{ steps.homeassistant.outputs.token }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            -H "Authorization: Bearer $HA_TOKEN" \
            "$HA_URL/api/config" > /tmp/ha-config.json

          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(
              Path("/tmp/ha-config.json").read_text()
          )

          assert config["state"] == "RUNNING", config
          print("Home Assistant startup verified")
          PY

      - name: Show Home Assistant logs on failure
        if: failure() && steps.homeassistant.outputs.containername != ''
        env:
          HA_CONTAINER: ${{ steps.homeassistant.outputs.containername }}
        run: docker logs "$HA_CONTAINER"
