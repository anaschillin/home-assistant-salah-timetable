name: Home Assistant unit compatibility

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * 0' # Weekly Sunday compatibility check, UTC

permissions:
  contents: read

concurrency:
  group: unit-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compatibility:
    name: HA ${{ matrix.ha-version }} (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exhaustive minimum-version coverage in four core groups and one
          # dedicated source-flow group (where mocked HTTP uploads run).
          - {lane: minimum, ha-version: '2026.10.0', plugin-version: '0.13.371', group: core-0}
          - {lane: minimum, ha-version: '2026.10.0', plugin-version: '0.13.371', group: core-1}
          - {lane: minimum, ha-version: '2026.10.0', plugin-version: '0.13.371', group: core-2}
          - {lane: minimum, ha-version: '2026.10.0', plugin-version: '0.13.371', group: core-3}
          - {lane: minimum, ha-version: '2026.10.0', plugin-version: '0.13.371', group: source-flow}
          # Run the complete, unsharded suite on the supported-current version.
          - {lane: supported-current, ha-version: '2026.10.3', plugin-version: '0.13.374', group: all}
    env:
      COMPAT_PROJECT: compatibility/${{ matrix.lane }}
    steps:
      - name: Configure isolated runner paths
        env:
          COMPAT_HA_VERSION: ${{ matrix.ha-version }}
        run: |
          mkdir -p "$RUNNER_TEMP/salah-unit-temp-$COMPAT_HA_VERSION"
          mkdir -p "$RUNNER_TEMP/salah-unit-evidence-$COMPAT_HA_VERSION"
          {
            echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/salah-unit-$COMPAT_HA_VERSION"
            echo "COMPAT_EVIDENCE=$RUNNER_TEMP/salah-unit-evidence-$COMPAT_HA_VERSION"
            echo "COVERAGE_FILE=$RUNNER_TEMP/salah-unit-$COMPAT_HA_VERSION.coverage"
            echo "TMPDIR=$RUNNER_TEMP/salah-unit-temp-$COMPAT_HA_VERSION"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.23'
      - name: Install separately locked compatibility environment
        run: |
          uv sync --project "$COMPAT_PROJECT" --frozen --python python3.14 --no-python-downloads
          uv pip check --python "$UV_PROJECT_ENVIRONMENT/bin/python"
      - name: Assert exact HA, plugin and Python versions
        run: |
          "$UV_PROJECT_ENVIRONMENT/bin/python" scripts/check_compatibility_environment.py \
            --ha-version '${{ matrix.ha-version }}' \
            --plugin-version '${{ matrix.plugin-version }}' \
            --environment "$UV_PROJECT_ENVIRONMENT" \
            --output "$COMPAT_EVIDENCE/environment.json"
          uv pip freeze --python "$UV_PROJECT_ENVIRONMENT/bin/python" > "$COMPAT_EVIDENCE/installed.txt"
      - name: Run assigned Python tests
        shell: bash
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          mapfile -t TEST_FILES < <(
            "$UV_PROJECT_ENVIRONMENT/bin/python" scripts/select_compatibility_tests.py "$TEST_GROUP"
          )
          test "${#TEST_FILES[@]}" -gt 0
          printf '%s\n' "${TEST_FILES[@]}" | tee "$COMPAT_EVIDENCE/test-files.txt"
          touch "$COMPAT_EVIDENCE/pytest.log"
          # Home Assistant async fixtures can leave a shard-level Python
          # process wedged. Isolate each test module, preserve the exhaustive
          # file partition, and stream progress so a stuck module is identifiable.
          # The regular 'tests' job still executes the full suite in one process.
          trap 'status=$?; if (( status != 0 )); then echo "::error::Test shard $TEST_GROUP exited with $status"; tail -n 100 "$COMPAT_EVIDENCE/pytest.log" || true; fi' EXIT
          for module in "${TEST_FILES[@]}"; do
            module_name="${module##*/}"
            echo "::group::$TEST_GROUP - $module_name"
            # --cov-append preserves cumulative coverage across subprocesses.
            # Each test module has its own JUnit report to avoid overwriting.
            timeout --signal=TERM --kill-after=15s 3m \
              env PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 \
              "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -c pyproject.toml \
                --timeout=30 -vv -o faulthandler_timeout=60 \
                --cov-append --cov-report= \
                --junitxml="$COMPAT_EVIDENCE/junit-$module_name.xml" \
                "$module" \
              2>&1 | tee -a "$COMPAT_EVIDENCE/pytest.log"
            echo "::endgroup::"
          done
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m coverage xml \
            -o "$COMPAT_EVIDENCE/coverage.xml"
      - name: Verify dependency locks remain unchanged
        if: always()
        run: git diff --exit-code -- pyproject.toml uv.lock compatibility/
      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ha-unit-compatibility-${{ matrix.ha-version }}-${{ matrix.group }}
          path: ${{ env.COMPAT_EVIDENCE }}/
          if-no-files-found: ignore
          retention-days: 7
